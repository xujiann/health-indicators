<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市实值分析 · 卫生健康指标库</title><style>
:root{--brand:#1f4e79;--ink:#17202e;--muted:#667085;--line:#dce3ec;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.nav{display:flex;gap:8px;justify-content:flex-end}.nav a,button,select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 12px;color:var(--brand);font:inherit}.nav a{text-decoration:none;font-weight:700}button:disabled,select:disabled{cursor:wait;opacity:.55}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:12px}.hero h1{margin:4px 0}.muted{color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.radar{width:100%;max-height:420px}.axis{fill:none;stroke:#cad5e2}.shape{fill:rgba(31,78,121,.2);stroke:var(--brand);stroke-width:2}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:8px;border-bottom:1px solid #edf1f5;text-align:left}.heat{display:grid;grid-template-columns:100px repeat(3,1fr);gap:3px}.heat>*{padding:7px;background:#f3f6f9;font-size:12px}.heat .gap{background:#fff0ed;color:#b42318}.status{min-height:24px}.status.error{color:#b42318;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.heat{overflow:auto}}
</style></head><body><main class="wrap"><nav class="nav"><a href="index.html">数据首页</a><a href="coverage.html">覆盖维护</a></nav><section class="hero"><div class="muted">ACTUAL VALUE ANALYTICS</div><h1>城市实值画像与差距分析</h1><p class="muted">仅使用选定年度的实际值；雷达图为同年城市 Min-Max 标准化，不表示官方综合评价。</p></section><section class="panel"><div class="controls"><label>年度 <select id="year"><option>2025</option><option>2024</option><option>2023</option></select></label><label>城市 <select id="city"></select></label><button id="exportSvg">导出雷达图 SVG</button><button id="exportCsv">导出排名 CSV</button><button id="exportSummary">导出分析摘要</button></div><div class="status" id="status" aria-live="polite">正在按需加载副省级城市数据包…</div><div class="grid"><div><svg id="radar" class="radar" viewBox="0 0 500 420" role="img" aria-label="城市指标标准化雷达图"></svg></div><div><table class="rank"><thead><tr><th>指标</th><th>实值</th><th>城市排名</th><th>标准化（0–100）</th></tr></thead><tbody id="ranking"></tbody></table></div></div></section><section class="panel"><h2>城市 × 年度缺口热力图</h2><div class="heat" id="heat"></div></section></main><script type="module" src="city-analysis.js"></script></body></html>
