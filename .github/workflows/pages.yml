name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Validate data and browser flows
        run: npm test

  deploy:
    needs: quality
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp app-core.js _site/
          cp public-data.js _site/
          cp analysis-workbench.js _site/
          cp city-analysis.html _site/
          cp city-analysis.js _site/
          cp health-trends.html _site/
          cp city-matrix.html _site/
          cp nhc-2025-change.html _site/
          cp insurance-compare.html _site/
          cp insights.css _site/
          cp insights-core.js _site/
          cp insights.js _site/
          cp about.html _site/
          cp coverage.html _site/
          cp README.md _site/
          cp CHANGELOG.md _site/
          cp .nojekyll _site/
          cp "公开指标数据库.xlsx" _site/
          cp -R docs _site/docs
          cp -R data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
